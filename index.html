<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Red Clay Reader</title>
    <meta
      name="description"
      content="Red Clay Reader helps libraries and readers browse, open, and enjoy public-domain Southern literature instantly from Open Library and the Internet Archive."
    />
    <meta
      name="keywords"
      content="public domain books, southern literature, open library, internet archive, online reader"
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#d64545" />
    <link rel="canonical" href="https://redclayreader.com/" />

    <meta property="og:site_name" content="Red Clay Reader" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Red Clay Reader" />
    <meta
      property="og:description"
      content="Browse and read public-domain Southern works with Red Clay Reader's fast Open Library search and built-in Internet Archive BookReader."
    />
    <meta property="og:url" content="https://redclayreader.com/" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Red Clay Reader" />
    <meta
      name="twitter:description"
      content="Discover Southern public-domain books, open beautiful scans, and keep reading progress in the browser with Red Clay Reader."
    />
    <meta name="twitter:url" content="https://redclayreader.com/" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Red Clay Reader",
        "url": "https://redclayreader.com/",
        "description": "Browse Southern public-domain literature and open embeddable Internet Archive editions with Red Clay Reader.",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://redclayreader.com/?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
